<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Guess Number Game</title>

    <style>
        body {
            font-family: sans-serif;
            width: 50%;
            max-width: 800px;
            min-width: 480px;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <h1>Guess The Number</h1>
    <p>
       Обрано рандомне число, спробуйте вгадати його
    </p>

    <div class="form">
        <label for="guessField">
            Enter a guess:
        </label>

        <input type="text" 
               id="guessField" 
               class="guessField">

        <input type="submit" 
               value="Submit guess" 
               class="guessSubmit" 
               id="submitguess">
    </div>

    <script type="text/javascript">

       
        let y = Math.floor(Math.random() * 1 + 20);

        
        let guess = 20;

        document.getElementById("submitguess").onclick = function () {

              
            let x = document.getElementById("guessField").value;

            if (x == y) {
                alert(" Вітаємо, ви вгадали число! ");
            }

            else {
                alert("Спробуйте інше число")
            }
        }
    </script>
</body>

</html>
